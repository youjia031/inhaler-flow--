<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>呼吸訓練遊戲廳</title>
<style>
  :root{
    --bg:#43111a; --panel:#5c1a26; --header:#370d14; --track:#2c0910;
    --gold:#ffd24a; --gold-dk:#b8862a; --red:#e6402f; --red-br:#ff6a52;
    --cream:#fff3df; --green:#7fe08d; --blue:#5fb0ff; --dim:#e0b58f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);
    font-family:"Microsoft JhengHei UI","PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;}
  .bar{background:var(--header);display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap;}
  button{font-family:inherit;border:none;border-radius:10px;cursor:pointer;font-weight:700;
    transition:transform .06s ease, filter .15s ease;}
  button:active{transform:translateY(1px) scale(.99);}
  .btn-gold{background:var(--gold);color:#3a0a10;} .btn-dk{background:var(--panel);color:var(--cream);}
  .btn-red{background:var(--red);color:var(--cream);}
  .btn-md{font-size:15px;padding:9px 16px;} .btn-lg{font-size:20px;padding:13px 24px;}
  input{font-family:inherit;background:var(--panel);color:var(--cream);border:none;border-radius:8px;
    padding:8px 10px;font-size:15px;outline:none;}
  #status{font-size:14px;color:var(--dim);} #status.on{color:var(--green);} #status.warn{color:var(--gold);}
  label{font-size:14px;color:var(--dim);}
  .spacer{flex:1;}
  #wrap{flex:1;position:relative;min-height:0;}
  canvas{width:100%;height:100%;display:block;}
  /* 主選單 */
  #hub{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:22px;padding:24px;background:var(--bg);}
  #hub h1{font-size:min(46px,7vw);color:var(--gold);margin:0;}
  #hub p{color:var(--dim);margin:0 0 6px;font-size:16px;}
  .cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:1000px;}
  .card{width:280px;min-height:220px;border-radius:18px;padding:22px;cursor:pointer;
    display:flex;flex-direction:column;gap:10px;color:#2a0a10;
    box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .1s ease, box-shadow .1s ease;}
  .card:hover{transform:translateY(-4px);box-shadow:0 10px 0 rgba(0,0,0,.25);}
  .card:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.25);}
  .card .big{font-size:30px;font-weight:800;}
  .card .tag{font-size:14px;font-weight:800;opacity:.7;}
  .card .desc{font-size:15px;line-height:1.5;font-weight:600;}
  .c1{background:linear-gradient(160deg,#ffd24a,#ffb03a);}
  .c2{background:linear-gradient(160deg,#8fe0a0,#5fb0ff);}
  .c3{background:linear-gradient(160deg,#ffb0b0,#ff7a6a);}
  #bottom{margin-top:auto;}
  #bottom.hide{display:none;}
  /* 上傳狀態小提示 */
  #syncStatus{font-size:12px;color:var(--dim);opacity:.85;}
  #syncStatus.err{color:var(--red-br);}
  /* 音量控制 */
  .volume-control{display:flex;align-items:center;gap:6px;background:var(--track);padding:4px 10px;border-radius:20px;}
  .volume-control input[type="range"]{width:60px;height:4px;background:var(--dim);border-radius:2px;padding:0;margin:0;}
  .volume-control input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--gold);cursor:pointer;}
  .vol-icon{font-size:16px;cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <div class="bar top">
    <button id="connectBtn" class="btn-gold btn-md">連接裝置</button>
    <span id="status">未連線 · 可用「↑ ↓ 方向鍵」試玩</span>
    <span class="spacer"></span>
    <div class="volume-control">
      <span class="vol-icon" id="muteBtn">🔊</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="70" />
    </div>
    <span id="syncStatus"></span>
    <label>姓名 / 編號</label>
    <input id="name" maxlength="12" size="8" placeholder="使用者" />
  </div>

  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="hub">
      <p>呼吸訓練遊戲廳</p>
      <h1>選一個遊戲開始</h1>
      <div class="cards">
        <div class="card c1" data-game="angrybird">
          <div class="tag">爆發力 · 吸氣</div>
          <div class="big">🐦 吸氣彈弓鳥</div>
          <div class="desc">深吸一口氣蓄力，放開就發射，把小鳥射去撞倒豬堡壘。練最大吸氣流速。</div>
        </div>
        <div class="card c3" data-game="balloon">
          <div class="tag">耐力 · 持久吐氣</div>
          <div class="big">🎈 吹氣球</div>
          <div class="desc">穩穩地把氣持續吐出去，讓氣球越吹越大，撐住就放飛。練持久力。</div>
        </div>
        <div class="card c2" data-game="taiko">
          <div class="tag">節奏 · 吸+吐</div>
          <div class="big">🥁 呼吸太鼓</div>
          <div class="desc">跟著長條吸氣、吐氣，顏色就是指令。整條吹好就是「良」。練呼吸節奏。</div>
        </div>
      </div>
    </div>
  </div>

  <div id="bottom" class="bar hide">
    <button id="backBtn" class="btn-dk btn-md">← 返回選單</button>
    <span class="spacer"></span>
    <button id="primary" class="btn-gold btn-lg">開始</button>
  </div>
</div>

<script type="module">
import { analyze, parseFFTLine, status as algoStatus } from "./breath_algorithm.js";
import angrybird from "./game_angrybird.js";
import balloon from "./game_balloon.js";
import taiko from "./game_taiko.js";

const GAMES = { angrybird, balloon, taiko };
const ONSET = 12;

// ================= 音效系統 =================
class SoundManager {
  constructor() {
    this.ctx = null;
    this.isInitialized = false;
    this.isMuted = false;
    this.masterVolume = 0.7;
    this.sfxVolume = 0.8;
    this.bgmVolume = 0.3;
    this.bgmSource = null;
    this.bgmGain = null;
    this.soundCache = new Map();
  }

  async init() {
    if (this.isInitialized) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') {
        await this.ctx.resume();
      }
      this.isInitialized = true;
      console.log('🎵 音效系統就緒');
    } catch(e) {
      console.warn('音效系統初始化失敗:', e);
    }
  }

  // 播放合成音效（不需外部檔案）
  playTone(freq = 440, duration = 0.15, type = 'sine', volume = 0.3, options = {}) {
    if (this.isMuted || !this.isInitialized) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      
      // 顫音效果
      if (options.vibrato) {
        const mod = this.ctx.createOscillator();
        const modGain = this.ctx.createGain();
        mod.frequency.value = options.vibratoSpeed || 5;
        modGain.gain.value = options.vibratoAmount || 5;
        mod.connect(modGain);
        modGain.connect(osc.frequency);
        mod.start();
        mod.stop(this.ctx.currentTime + duration);
      }

      const vol = volume * this.sfxVolume * this.masterVolume;
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch(e) { /* 靜默處理 */ }
  }

  // 播放音效：按事件名稱
  play(event, extra = {}) {
    const sounds = {
      // 系統音效
      'connect': () => this.playTone(523, 0.1, 'sine', 0.3) || 
                         setTimeout(() => this.playTone(659, 0.1, 'sine', 0.25), 100),
      'disconnect': () => this.playTone(440, 0.15, 'sawtooth', 0.2),
      'game_start': () => { this.playTone(523, 0.1, 'sine', 0.3);
                           setTimeout(() => this.playTone(659, 0.1, 'sine', 0.3), 100);
                           setTimeout(() => this.playTone(784, 0.15, 'sine', 0.3), 200); },
      'back_menu': () => this.playTone(659, 0.1, 'sine', 0.2) ||
                         setTimeout(() => this.playTone(523, 0.1, 'sine', 0.2), 100),
      'click': () => this.playTone(880, 0.05, 'sine', 0.15),
      'error': () => this.playTone(220, 0.3, 'sawtooth', 0.2),
      
      // 通用遊戲音效
      'success': () => { this.playTone(880, 0.15, 'sine', 0.4);
                         setTimeout(() => this.playTone(1100, 0.1, 'sine', 0.3), 120); },
      'fail': () => this.playTone(220, 0.4, 'sawtooth', 0.2),
      'record_break': () => { [523, 659, 784, 1047].forEach((f, i) => 
                              setTimeout(() => this.playTone(f, 0.2, 'square', 0.2), i*100)); },
      'breath_start': () => this.playTone(440, 0.05, 'sine', 0.15),
      'breath_end': () => this.playTone(330, 0.05, 'sine', 0.15),
      'breath_strong': () => this.playTone(660, 0.08, 'sine', 0.25),
      'level_up': () => { this.playTone(523, 0.1, 'sine', 0.3);
                          setTimeout(() => this.playTone(659, 0.1, 'sine', 0.3), 100);
                          setTimeout(() => this.playTone(784, 0.15, 'sine', 0.3), 200);
                          setTimeout(() => this.playTone(1047, 0.2, 'sine', 0.3), 300); },
      
      // 彈弓鳥專屬
      'angrybird_launch_small': () => this.playTone(600, 0.2, 'sine', 0.2, {vibrato:true}),
      'angrybird_launch_medium': () => this.playTone(500, 0.4, 'sine', 0.25, {vibrato:true}),
      'angrybird_launch_big': () => { this.playTone(400, 0.6, 'sine', 0.3, {vibrato:true});
                                       setTimeout(() => this.playTone(200, 0.3, 'sawtooth', 0.3), 500); },
      'angrybird_wall': () => { this.playTone(100, 0.5, 'sawtooth', 0.4);
                                for(let i=0; i<5; i++) {
                                  setTimeout(() => this.playTone(300+Math.random()*200, 0.05, 'sine', 0.1), i*80);
                                } },
      
      // 氣球專屬
      'balloon_pop': () => this.playTone(1200, 0.05, 'sine', 0.2),
      'balloon_fly': () => { this.playTone(800, 0.1, 'sine', 0.2);
                             setTimeout(() => this.playTone(1000, 0.1, 'sine', 0.2), 100);
                             setTimeout(() => this.playTone(1200, 0.15, 'sine', 0.2), 200); },
      'balloon_deflate': () => this.playTone(300, 0.5, 'sawtooth', 0.15),
      'balloon_90': () => this.playTone(440, 0.08, 'square', 0.15),
      
      // 太鼓專屬
      'taiko_great': () => { this.playTone(150, 0.1, 'square', 0.4);
                             setTimeout(() => this.playTone(200, 0.1, 'square', 0.3), 80); },
      'taiko_good': () => this.playTone(150, 0.15, 'square', 0.3),
      'taiko_miss': () => this.playTone(80, 0.3, 'sawtooth', 0.2),
      'taiko_clear': () => { [200, 250, 300, 400, 500].forEach((f, i) =>
                              setTimeout(() => this.playTone(f, 0.1, 'square', 0.25), i*100)); },
    };

    const soundFn = sounds[event];
    if (soundFn) {
      soundFn();
    } else if (extra.fallback) {
      this.playTone(extra.fallback.freq || 440, extra.fallback.duration || 0.15, 'sine', 0.2);
    }
  }

  // 背景音樂
  playBgm(style = 'menu') {
    this.stopBgm();
    if (this.isMuted) return;
    
    // 用合成器產生簡單的背景音樂
    const patterns = {
      'menu': { notes: [523, 523, 659, 659, 784, 659, 523], tempo: 120, volume: 0.15 },
      'angrybird': { notes: [392, 440, 523, 440, 392, 440, 523, 587], tempo: 140, volume: 0.12 },
      'balloon': { notes: [523, 587, 659, 784, 659, 587, 523], tempo: 100, volume: 0.15 },
      'taiko': { notes: [294, 392, 440, 392, 294, 392, 440, 523], tempo: 160, volume: 0.10 },
    };

    const pattern = patterns[style] || patterns.menu;
    this.bgmInterval = setInterval(() => {
      if (this.isMuted) return;
      const note = pattern.notes[Math.floor(Math.random() * pattern.notes.length)];
      this.playTone(note, 0.2, 'sine', pattern.volume * 0.3);
    }, (60 / pattern.tempo) * 1000 * 2);
  }

  stopBgm() {
    if (this.bgmInterval) {
      clearInterval(this.bgmInterval);
      this.bgmInterval = null;
    }
  }

  setVolume(v) {
    this.masterVolume = Math.max(0, Math.min(1, v));
  }

  toggleMute() {
    this.isMuted = !this.isMuted;
    if (this.isMuted) {
      this.stopBgm();
    }
    return this.isMuted;
  }
}

const sound = new SoundManager();

// ================= 顏色(給遊戲用) =================
const COLORS = { bg:"#43111a", panel:"#5c1a26", header:"#370d14", track:"#2c0910",
  gold:"#ffd24a", goldDk:"#b8862a", red:"#e6402f", redBr:"#ff6a52",
  cream:"#fff3df", green:"#7fe08d", blue:"#5fb0ff", dim:"#e0b58f" };

// ================= 雲端上傳 =================
const LOG_ENDPOINT = "/api/log";

function setSyncStatus(text, isErr=false){
  syncStatusEl.textContent = text;
  syncStatusEl.className = isErr ? "err" : "";
}

async function uploadLog(payload){
  try{
    const res = await fetch(LOG_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: api.name(), ts: Date.now(), ...payload }),
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    setSyncStatus("☁ 已同步");
  }catch(err){
    console.warn("上傳失敗(不影響遊戲):", err);
    setSyncStatus("☁ 同步失敗，稍後重試", true);
  }
}

// ================= 儲存 =================
const mem = {};
const store = {
  get(k, def=null){ try{ const v=localStorage.getItem("bt_"+k); return v==null?def:JSON.parse(v); }
    catch{ return (k in mem)?mem[k]:def; } },
  set(k, v){
    try{ localStorage.setItem("bt_"+k, JSON.stringify(v)); }catch{ mem[k]=v; }
    uploadLog({ type:"score", game: current ? currentId : null, key:k, value:v });
  },
};

// ================= 裝置連線 =================
let port=null, reader=null, keepReading=false, lastFFT=null, lastTs=0;
async function connect(){
  if(port){ await disconnect(); return; }
  if(!("serial" in navigator)){ setStatus("此瀏覽器不支援 Web Serial,請用 Chrome/Edge","warn"); return; }
  try{ port=await navigator.serial.requestPort(); await port.open({baudRate:115200}); }
  catch{ setStatus("未選擇裝置 · 可用方向鍵試玩","warn"); port=null; return; }
  connectBtn.textContent="斷線"; setStatus("已連線","on"); keepReading=true; readLoop();
  sound.play('connect');
  uploadLog({ type:"connect" });
}
async function disconnect(){
  keepReading=false;
  try{ if(reader){ await reader.cancel(); reader.releaseLock(); } }catch{}
  try{ if(port){ await port.close(); } }catch{}
  port=null; reader=null; connectBtn.textContent="連接裝置"; setStatus("未連線 · 可用方向鍵試玩","");
  sound.play('disconnect');
  uploadLog({ type:"disconnect" });
}
async function readLoop(){
  const dec=new TextDecoderStream(); port.readable.pipeTo(dec.writable).catch(()=>{});
  reader=dec.readable.getReader(); let buf="";
  while(keepReading){ let r; try{ r=await reader.read(); }catch{ break; } if(r.done) break;
    buf+=r.value; let i;
    while((i=buf.indexOf("\n"))>=0){ const ln=buf.slice(0,i).trim(); buf=buf.slice(i+1);
      const b=parseFFTLine(ln); if(b){ lastFFT=b; lastTs=performance.now()/1000; } } }
}

// ================= 鍵盤試玩 =================
let upDown=false, dnDown=false, upFlow=0, dnFlow=0;
addEventListener("keydown", e=>{ if(e.key==="ArrowUp"){upDown=true;e.preventDefault();}
  if(e.key==="ArrowDown"){dnDown=true;e.preventDefault();}
  if(e.code==="Space"){ onPrimary(); e.preventDefault(); } });
addEventListener("keyup", e=>{ if(e.key==="ArrowUp")upDown=false; if(e.key==="ArrowDown")dnDown=false; });

// ================= 取樣即時輸入 =================
const EXHALE_BIAS_WINDOW = 0.4;
let exhaleBiasBuffer = [];

function sample(now, dt){
  const RAMP=240, DECAY=420, KMAX=150;
  upFlow = upDown ? Math.min(KMAX,upFlow+RAMP*dt) : Math.max(0,upFlow-DECAY*dt);
  dnFlow = dnDown ? Math.min(KMAX,dnFlow+RAMP*dt) : Math.max(0,dnFlow-DECAY*dt);
  let flow=0, direction=null;
  if(upFlow>1 || dnFlow>1){
    if(upFlow>=dnFlow){ flow=upFlow; direction="inhalation"; }
    else { flow=dnFlow; direction="exhalation"; }
  } else if(now-lastTs<0.3 && lastFFT){
    const a=analyze(lastFFT);
    if(a.active){
      flow=a.flow; direction=a.direction;
      if(current===GAMES.balloon){
        if(direction==="exhalation") exhaleBiasBuffer.push({t:now});
        exhaleBiasBuffer = exhaleBiasBuffer.filter(b=> now-b.t <= EXHALE_BIAS_WINDOW);
        if(exhaleBiasBuffer.length>0) direction="exhalation";
      }
    } else {
      exhaleBiasBuffer=[];
    }
  } else {
    exhaleBiasBuffer=[];
  }
  const active = flow>=ONSET;
  const signed = direction==="inhalation"? flow : direction==="exhalation"? -flow : 0;
  return { flow, direction, active, signed, now, dt };
}

// ================= 繪圖 helper =================
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
function resize(){ const r=cv.getBoundingClientRect(), dpr=devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener("resize", resize);
const g = {
  ctx, colors: COLORS,
  clear(c){ ctx.fillStyle=c||COLORS.bg; ctx.fillRect(0,0,cv.clientWidth,cv.clientHeight); },
  rrect(x1,y1,x2,y2,r){ r=Math.min(r,Math.abs(x2-x1)/2,Math.abs(y2-y1)/2); ctx.beginPath();
    ctx.moveTo(x1+r,y1); ctx.arcTo(x2,y1,x2,y2,r); ctx.arcTo(x2,y2,x1,y2,r);
    ctx.arcTo(x1,y2,x1,y1,r); ctx.arcTo(x1,y1,x2,y1,r); ctx.closePath(); },
  fill(c){ ctx.fillStyle=c; ctx.fill(); }, stroke(c,w){ ctx.strokeStyle=c; ctx.lineWidth=w||2; ctx.stroke(); },
  text(t,x,y,size,c,align="center",bold=true){ ctx.fillStyle=c; ctx.textAlign=align; ctx.textBaseline="middle";
    ctx.font=`${bold?"bold ":""}${size}px "Microsoft JhengHei UI","Noto Sans TC",sans-serif`; ctx.fillText(t,x,y); },
  line(x1,y1,x2,y2,c,w,dash){ ctx.strokeStyle=c; ctx.lineWidth=w||2; ctx.setLineDash(dash||[]);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.setLineDash([]); },
  circle(x,y,r,c,fill=true){ ctx.beginPath(); ctx.arc(x,y,r,0,6.283);
    if(fill){ ctx.fillStyle=c; ctx.fill(); } else { ctx.strokeStyle=c; ctx.lineWidth=2; ctx.stroke(); } },
};

// ================= API 給遊戲 =================
const api = { colors:COLORS, store, ONSET,
  name(){ return (nameEl.value.trim()||"使用者"); },
  back(){ toHub(); },
  sound: sound, // 讓遊戲可以觸發音效
};

// ================= 遊戲切換 =================
let current=null, currentId=null, lastActive=false;

function startGame(id){
  // 初始化音效
  sound.init();
  
  current = GAMES[id]; if(!current) return;
  currentId = id;
  hub.style.display="none"; bottom.classList.remove("hide");
  if(current.reset) current.reset(api);
  primary.textContent = current.primaryLabel? (current.primaryLabel()||"") : "";
  primary.style.display = primary.textContent? "" : "none";
  resize();
  segActive=false; segSamples=[];
  
  sound.play('game_start');
  sound.playBgm(id);
  uploadLog({ type:"game_start", game:id });
}
function toHub(){
  sound.play('back_menu');
  sound.stopBgm();
  sound.playBgm('menu');
  current=null; currentId=null; hub.style.display="flex"; bottom.classList.add("hide");
  segActive=false; segSamples=[];
}
function onPrimary(){
  if(current && current.primary){ 
    current.primary(api);
    sound.play('click');
    if(current.primaryLabel){ const t=current.primaryLabel()||""; primary.textContent=t;
      primary.style.display=t?"":"none"; } 
  }
}

// ================= 波形紀錄 =================
const SEG_MIN_DURATION = 0.15;
const SEG_MAX_POINTS = 150;
let segActive=false, segStart=0, segSamples=[];

function downsample(arr, maxPoints){
  if(arr.length<=maxPoints) return arr;
  const stride = arr.length/maxPoints;
  const out=[];
  for(let i=0;i<maxPoints;i++) out.push(arr[Math.floor(i*stride)]);
  return out;
}

function handleSegment(input){
  if(!current) { segActive=false; segSamples=[]; return; }
  if(input.active){
    if(!segActive){ 
      segActive=true; segStart=input.now; segSamples=[]; 
      sound.play('breath_start');
    }
    // 根據流速強度觸發不同音效
    if(input.flow > 80) sound.play('breath_strong');
    segSamples.push({
      t:+(input.now-segStart).toFixed(2),
      f:Math.round(input.flow),
      d:input.direction==="inhalation"?1:input.direction==="exhalation"?-1:0,
    });
  } else if(segActive){
    segActive=false;
    sound.play('breath_end');
    const duration = input.now - segStart;
    if(duration>=SEG_MIN_DURATION && segSamples.length>0){
      uploadLog({ type:"attempt", game:currentId, duration:+duration.toFixed(2),
        series: downsample(segSamples, SEG_MAX_POINTS) });
    }
    segSamples=[];
  }
}

// ================= 主迴圈 =================
let last=performance.now()/1000, lastScoreCheck=0;

function loop(){
  const now=performance.now()/1000; let dt=Math.min(now-last,0.1); last=now;
  const input=sample(now,dt);
  handleSegment(input);
  const w=cv.clientWidth, h=cv.clientHeight;
  if(current){
    // 記錄遊戲分數變化來觸發音效
    if(current.getScore) {
      const score = current.getScore();
      if(score > lastScoreCheck) {
        sound.play('success');
      }
      lastScoreCheck = score;
    }
    
    if(current.update) current.update(dt,input,api);
    g.clear(COLORS.bg);
    if(current.render) current.render(g,w,h,api);
    if(current.primaryLabel){ const t=current.primaryLabel()||"";
      if(primary.textContent!==t){ primary.textContent=t; primary.style.display=t?"":"none"; } }
  }
  requestAnimationFrame(loop);
}

nameEl.onchange=()=> store.set("name", nameEl.value.trim());
setStatus(`未連線 · 可用方向鍵試玩 · ${algoStatus()}`,"");

  sound.play('click');

// 初始化選單背景音樂
sound.init().then(() => {
  sound.playBgm('menu');
});

resize(); loop();
